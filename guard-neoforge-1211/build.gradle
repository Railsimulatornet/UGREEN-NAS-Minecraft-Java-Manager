plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version='1.0.7'
group='de.romanglos.mcj'
base { archivesName='mcj-guard-neoforge-1.21.1' }
java { toolchain.languageVersion=JavaLanguageVersion.of(21); withSourcesJar() }
neoForge { version='21.1.265' }
tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8' }
processResources {
    inputs.property('modVersion',project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version':project.version }
}
jar { manifest { attributes('Implementation-Version':project.version) } }
tasks.register('networkAccessCheck',JavaExec) {
    dependsOn testClasses
    classpath=sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass='de.romanglos.mcj.NetworkAccessCheck'
}
check.dependsOn networkAccessCheck
// Policy checks use the executable fixture above, not a JUnit test engine.
test { failOnNoDiscoveredTests=false }

processResources {
    inputs.property('guardBuildVersion',project.version)
    filesMatching('mcj-guard-version.properties') { expand 'version':project.version }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
