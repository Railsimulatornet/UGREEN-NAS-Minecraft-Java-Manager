plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '7.0.29' }
version='1.0.7'
group='de.romanglos.mcj'
base { archivesName='mcj-guard-forge-1.21.1' }
// ForgeGradle's Mavenizer runs on Java 25; the mod targets Java 21 below.
java { toolchain.languageVersion=JavaLanguageVersion.of(25); withSourcesJar() }
minecraft {
    mappings channel: 'official', version: '1.21.1'
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.20')
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}
tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8' }
processResources {
    filesMatching('META-INF/mods.toml') { expand 'version':project.version }
    filesMatching('mcj-guard-version.properties') { expand 'version':project.version }
}
jar { manifest { attributes('MixinConfigs':'mcj_guard.mixins.json','Implementation-Version':project.version) } }

tasks.register('networkAccessCheck',JavaExec) {
    dependsOn testClasses
    classpath=sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass='de.romanglos.mcj.NetworkAccessCheck'
}
check.dependsOn networkAccessCheck
test { failOnNoDiscoveredTests=false }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
