name: Tests und Docker-Image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Docker-Image als Prüfarbeitsstand bauen; kein Registry-Upload'
        type: boolean
        default: false
        required: true
      full_validation:
        description: 'Zusätzlich die vollständige Regression und Schutzkomponenten erneut prüfen'
        type: boolean
        default: false
        required: true
      publish_image:
        description: 'Docker-Image übertragen: nur nach ausdrücklicher Freigabe aktivieren'
        type: boolean
        default: false
        required: true
      installation_tags:
        description: 'Zusätzlich Installationsversion und stable auf genau dieses geprüfte Image setzen'
        type: boolean
        default: false
        required: true
      anonymous_installation:
        description: 'Nur anonyme Downloadprüfung ausführen (kein Build und keine Übertragung)'
        type: boolean
        default: false
        required: true
      expected_revision:
        description: 'Für die anonyme Prüfung: vollständiger Quell-Commit'
        type: string
        required: false
      expected_digest:
        description: 'Für die anonyme Prüfung: erwarteter Registry-Digest sha256:…'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      targeted: ${{ steps.scope.outputs.targeted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        env:
          MCJ_FULL_VALIDATION: ${{ inputs.full_validation }}
        run: python3 .github/scripts/validation_scope.py
  tests:
    needs: scope
    if: github.event_name != 'workflow_dispatch' || inputs.anonymous_installation != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regression tests
        if: needs.scope.outputs.targeted != 'true'
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Dokumentation, Sprachabgleich und Veröffentlichungsschutz
        if: needs.scope.outputs.targeted == 'true'
        run: >-
          python -m pytest -q
          tests/test_user_text_contract.py tests/test_release_portability.py
          tests/test_release_links.py tests/test_validation_scope.py tests/test_publication_gate.py
          tests/test_release_metadata.py
          tests/test_sources.py tests/test_existing_mod_source.py tests/test_mod_versions.py tests/test_curseforge_search.py
          tests/test_versions.py tests/test_gui_installation.py
          --junitxml=test-results.xml
      - name: JavaScript syntax
        run: |
          node --check mcj/static/app.js
          node --check mcj/static/bootstrap.js
          node --check mcj/static/bootstrap-i18n.js
          node --check mcj/static/i18n.js
      - name: Setup handover regression
        run: node --test tests/setup_handover.test.cjs tests/visible_messages.test.cjs tests/factor_change.test.cjs
      - name: E-Mail-Erststart und DE/EN-Textabgleich
        run: node --test tests/email_first_setup.test.cjs tests/user_text_audit.test.cjs tests/client_pack_text.test.cjs
      - name: Auswahl löschbarer Sicherungen
        run: node --test tests/backup_selection.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14
  guard:
    needs: scope
    if: needs.scope.outputs.targeted != 'true' && (github.event_name != 'workflow_dispatch' || inputs.anonymous_installation != true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: neoforge-263
            folder: guard-neoforge
            manifest: guard.json
            image: gradle@sha256:ca424744a6a45a575f333edea680696d980999c461be38b1574a4c70d5455f24
          - adapter: fabric-1201
            folder: guard-fabric-1201
            manifest: guard-fabric-1201.json
            image: gradle@sha256:ca424744a6a45a575f333edea680696d980999c461be38b1574a4c70d5455f24
          - adapter: fabric-1211
            folder: guard-fabric-1211
            manifest: guard-fabric-1211.json
            image: gradle@sha256:ca424744a6a45a575f333edea680696d980999c461be38b1574a4c70d5455f24
          - adapter: fabric-263
            folder: guard-fabric-263
            manifest: guard-fabric-263.json
            image: gradle@sha256:ca424744a6a45a575f333edea680696d980999c461be38b1574a4c70d5455f24
          - adapter: forge-1201
            folder: guard-forge-1201
            manifest: guard-forge-1201.json
            image: gradle@sha256:ce50078d456e497bc86b76d386503e84aa45416d85069ad66bc072bf07566b25
          - adapter: forge-1211
            folder: guard-forge-1211
            manifest: guard-forge-1211.json
            image: gradle@sha256:ca424744a6a45a575f333edea680696d980999c461be38b1574a4c70d5455f24
          - adapter: forge-263
            folder: guard-forge-263
            manifest: guard-forge-263.json
            image: gradle@sha256:ca424744a6a45a575f333edea680696d980999c461be38b1574a4c70d5455f24
          - adapter: neoforge-1211
            folder: guard-neoforge-1211
            manifest: guard-neoforge-1211.json
            image: gradle@sha256:d5dd38d022b3d7bca5ddd7789d5937396c27320123e5121bf06a6c06934222c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Schutzkomponente aus dem Quellcode bauen und prüfen
        shell: bash
        env:
          GUARD_FOLDER: ${{ matrix.folder }}
          GUARD_MANIFEST: ${{ matrix.manifest }}
          GRADLE_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p .guard-gradle-cache
          docker run --rm --user "$(id -u):$(id -g)" --cpus 2 --memory 4g --pids-limit 512 --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp:rw,nosuid,exec,size=1g -v "$PWD:/workspace" -w "/workspace/$GUARD_FOLDER" -e GRADLE_USER_HOME=/workspace/.guard-gradle-cache -e HOME=/tmp "$GRADLE_IMAGE" gradle --no-daemon --max-workers=2 clean build --console=plain | tee guard-build.log
          python3 -c "import hashlib,json,pathlib,os; p=pathlib.Path('artifacts'); m=json.loads((p/os.environ['GUARD_MANIFEST']).read_text()); built=pathlib.Path(os.environ['GUARD_FOLDER'])/'build/libs'/m['filename']; assert hashlib.sha256(built.read_bytes()).hexdigest()==m['sha256'], 'Gebündeltes JAR stimmt nicht mit reproduziertem Build überein'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: guard-build-pruefung-${{ matrix.adapter }}
          path: guard-build.log
          retention-days: 14
  build:
    needs: [scope, tests, guard]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.build_image == true || inputs.publish_image == true) && inputs.anonymous_installation != true && needs.tests.result == 'success' && (needs.guard.result == 'success' || needs.guard.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Versionsnummer und Image-Tags prüfen
        id: release
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          INSTALLATION_TAGS: ${{ inputs.installation_tags }}
        run: python3 .github/scripts/release_metadata.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/amd64
          tags: mcj-candidate:ci
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.release.outputs.created }}
          outputs: type=docker,dest=/tmp/mcj-image.tar
          provenance: false
      - name: Verify packaged entry points
        run: |
          docker load --input /tmp/mcj-image.tar
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint python mcj-candidate:ci -c "import subprocess;[subprocess.run(['dpkg','--compare-versions',subprocess.check_output(['dpkg-query','-W',p],text=True).split()[1],'ge','3.0.4'],check=True)for p in ['apt','libapt-pkg7.0']]"
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint python mcj-candidate:ci -c "import sys,runpy,os;sys.path=['/opt/mcj/tools']+[p for p in sys.path if p not in ['', '/opt/mcj']];os.chdir('/');runpy.run_path('/opt/mcj/tools/browser_setup.py',run_name='probe');runpy.run_path('/opt/mcj/tools/bootstrap_worker.py',run_name='probe')"
      - name: Vollständigen Image-Schwachstellenbericht erstellen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: mcj-candidate:ci
          format: json
          output: /tmp/trivy-vollstaendig.json
          exit-code: '0'
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: image-schwachstellen-vollstaendig
          path: /tmp/trivy-vollstaendig.json
          if-no-files-found: warn
          retention-days: 14
      - name: Neue erhebliche Image-Befunde vor der Übertragung sperren
        run: >-
          python3 .github/scripts/image_vulnerability_review.py
          --report /tmp/trivy-vollstaendig.json
          --baseline docs/security/image-baseline-1.0.1.json
          --output /tmp/image-review.json
      - name: Behebbare hohe und kritische Image-Funde sperren
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: mcj-candidate:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Native app update and rollback acceptance
        if: needs.scope.outputs.targeted != 'true'
        run: python3 tests/native_app_update.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && needs.scope.outputs.targeted != 'true'
        with:
          name: native-app-update
          path: /tmp/native-app-update.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Hash tested image
        run: cd /tmp && sha256sum mcj-image.tar > mcj-image.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tested-container-image
          path: |
            /tmp/mcj-image.tar
            /tmp/mcj-image.tar.sha256
          retention-days: 3
  publish:
    needs: build
    # Pushes, Pull Requests und Versions-Tags dürfen keine Images übertragen.
    # Dieser manuelle Schritt ändert keine Repository-/Registry-Sichtbarkeit.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image == true && inputs.anonymous_installation != true && github.repository == 'Railsimulatornet/UGREEN-NAS-Minecraft-Java-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Versionsnummer und Image-Tags prüfen
        id: release
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          INSTALLATION_TAGS: ${{ inputs.installation_tags }}
        run: python3 .github/scripts/release_metadata.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-container-image
          path: /tmp/image
      - name: Verify and load tested archive
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /tmp/image
          sha256sum -c mcj-image.tar.sha256
          docker load --input mcj-image.tar
          test "$(docker image inspect mcj-candidate:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$EXPECTED_VERSION"
          test "$(docker image inspect mcj-candidate:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_REVISION"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish exact tested image
        env:
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/scripts/publish_tested_image.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-image
          path: /tmp/release-image.json
          retention-days: 90
  anonymous-pull:
    if: github.event_name == 'workflow_dispatch' && inputs.anonymous_installation == true && github.repository == 'Railsimulatornet/UGREEN-NAS-Minecraft-Java-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Installations-Tags ohne Anmeldung und ohne vorhandenes MCJ-Image prüfen
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
        run: python3 .github/scripts/anonymous_image_pull.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: anonyme-installationspruefung
          path: /tmp/anonymous-installation.json
          if-no-files-found: warn
          retention-days: 14
