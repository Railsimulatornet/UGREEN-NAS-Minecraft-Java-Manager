name: OpenSSL-Sicherheitsupdate nachprüfen
on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: openssl-security-retest
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'Railsimulatornet/UGREEN-NAS-Minecraft-Java-Manager' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Debian-Paket prüfen und Image-Test anfordern
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/openssl_retest.py
