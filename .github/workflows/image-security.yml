name: Veröffentlichtes Image prüfen
on:
  schedule:
    - cron: '17 7 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: released-image-security
  cancel-in-progress: false
jobs:
  scan:
    if: github.repository == 'Railsimulatornet/UGREEN-NAS-Minecraft-Java-Manager'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      IMAGE_DIGEST: ${{ vars.MCJ_RELEASE_IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Festen veröffentlichten Digest prüfen
        run: |
          python3 -c "import os,re; assert re.fullmatch(r'sha256:[0-9a-f]{64}',os.environ['IMAGE_DIGEST']), 'Veröffentlichter Image-Digest fehlt'"
      - name: Vollständigen Bericht erstellen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: railsimulatornet/ugreen-nas-minecraft-java-manager@${{ env.IMAGE_DIGEST }}
          format: json
          output: image-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln
      - name: Neue erhebliche Befunde melden
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/scripts/image_vulnerability_review.py
          --report image-vulnerabilities.json
          --baseline docs/security/image-baseline-1.0.0.json
          --output image-review.json --notify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: image-sicherheitsbericht
          path: |
            image-vulnerabilities.json
            image-review.json
          if-no-files-found: error
          retention-days: 90
