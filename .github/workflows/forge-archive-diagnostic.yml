name: Forge-JAR gezielt vergleichen
on:
  push:
    branches: [codex/forge1201-repro]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Zwei saubere Builds in derselben Umgebung
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge-archive-report"
          for attempt in a b; do
            root="$RUNNER_TEMP/forge-repro-$attempt"
            mkdir -p "$root/.guard-gradle-cache"
            git archive HEAD guard-forge-1201 | tar -x -C "$root"
            docker run --rm --user "$(id -u):$(id -g)" --cpus 2 --memory 4g --pids-limit 512 --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp:rw,nosuid,exec,size=1g -v "$root:/workspace" -w /workspace/guard-forge-1201 -e GRADLE_USER_HOME=/workspace/.guard-gradle-cache -e HOME=/tmp gradle@sha256:ce50078d456e497bc86b76d386503e84aa45416d85069ad66bc072bf07566b25 gradle --no-daemon --max-workers=2 clean build --console=plain | tee "$RUNNER_TEMP/forge-archive-report/build-$attempt.log"
            cp "$root/guard-forge-1201/build/libs/mcj-guard-forge-1.20.1-1.0.7.jar" "$RUNNER_TEMP/forge-archive-report/build-$attempt.jar"
          done
          cp artifacts/releases/guards/forge-1.20.1/mcj-guard-forge-1.20.1-1.0.7.jar "$RUNNER_TEMP/forge-archive-report/released.jar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: forge-archive-comparison
          path: ${{ runner.temp }}/forge-archive-report/
          if-no-files-found: error
          retention-days: 7
